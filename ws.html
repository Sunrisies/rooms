<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // ws://127.0.0.1:18080/ws/{id}/{user_id}
        const ws = new WebSocket('ws://127.0.0.1:18080/ws/1/2');
        ws.onopen = function () {
            console.log('ws open');
        }
        ws.onmessage = function (e) {
            console.log('ws onmessage', e);
        }
        ws.onclose = function () {
            console.log('ws close');
        }
    </script>
</body>

</html>
