[package]
name = "rooms"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"
sea-orm = { version = "1.1.14", features = [
    "sqlx-postgres",
    'runtime-tokio-rustls',
    'macros',
] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
bcrypt = "0.15"
dotenvy = "0.15"
actix-ws = "0.3.0"
futures-util = "0.3.31"
actix-rt = "2.11.0"
